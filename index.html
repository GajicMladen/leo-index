      /* Splash painted before the JS bundle arrives (slow networks): brand colour + name, replaced by React. */
      html, body, #root { height: 100%; margin: 0; }

      .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--color-forest-800, #222); }

/* self-hosted display font (latin + latin-ext for Serbian diacritics); /leo-index/ is filled in by vite.config.ts.
   Rubik ExtraBold Italic, the slanted heavy face of the LEO INDEX wordmark. Declared as font-style: normal under its own
   family name so every headline-* renders the italic cut without a font-style token (headlines have none). */
@font-face {
  font-family: 'Rubik ExtraBold Italic';
  font-style: normal;
  font-weight: 800;
  font-display: swap;
  src: url(/leo-index/fonts/rubik-800i-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: 'Rubik ExtraBold Italic';
  font-style: normal;
  font-weight: 800;
  font-display: swap;
  src: url(/leo-index/fonts/rubik-800i-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
